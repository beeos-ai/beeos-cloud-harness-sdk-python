[project]
name = "beeos-cloud-harness-sdk"
version = "1.0.0"
description = "BeeOS Cloud Harness SDK"
requires-python = ">=3.11"
# The package root (`__init__`) is stdlib-only. The submodules below add these.
dependencies = ["httpx>=0.27", "cryptography>=42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
