[project]
name = "beeos-cloud-harness-sdk"
version = "1.0.0"
description = "BeeOS Cloud Harness SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BeeOS" }]
requires-python = ">=3.11"
# The package root (`__init__`) is stdlib-only. The submodules below add these.
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.urls]
Repository = "https://github.com/beeos-ai/beeos-cloud-harness-sdk-python"
Issues = "https://github.com/beeos-ai/beeos-cloud-harness-sdk-python/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
