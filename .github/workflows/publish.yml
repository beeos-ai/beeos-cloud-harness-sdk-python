name: Publish Harness SDK to PyPI
on:
  push:
    tags:
      - harness-sdk-py-v*

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_NAME'] != f'harness-sdk-py-v{version}':
              raise SystemExit('Release tag does not match the package version')
          PY
      - name: Test and build
        run: |
          python -m pip install . pytest pytest-asyncio build twine
          python -m pytest -q
          python -m compileall -q beeos_cloud_harness_sdk
          python -m build --sdist --wheel
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
